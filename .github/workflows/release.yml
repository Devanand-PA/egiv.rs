name: Build and Release egiv

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  version-check:
    name: Check version change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-output.outputs.version }}
      changed: ${{ steps.changed-output.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need parent commit
      - name: Extract version from Cargo.toml
        id: version-output
        run: |
          VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Check if version changed vs parent commit
        id: changed-output
        run: |
          # Get Cargo.toml from parent commit
          if git show HEAD~1:Cargo.toml 2>/dev/null | grep -q "^version ="; then
            PREV_VERSION=$(git show HEAD~1:Cargo.toml | grep -m1 '^version =' | cut -d'"' -f2)
          else
            PREV_VERSION=""
          fi
          CURRENT_VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)
          if [[ "$CURRENT_VERSION" != "$PREV_VERSION" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version-check
    if: ${{ needs.version-check.outputs.changed == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-v2

      # The image crate's `avif-native` feature needs libdav1d at build time.
      # meson/ninja/nasm let dav1d-sys build a pinned, static dav1d from source
      # (via SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=auto below), so the released
      # binaries are self-contained and don't depend on a system libdav1d.
      - name: Install dav1d build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build nasm

      - name: Install dav1d build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja nasm

      - name: Install dav1d build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install meson ninja
          # dav1d-sys's vendored build reads the generated dav1d.pc through
          # pkg-config; pkgconfiglite provides that binary on Windows.
          choco install pkgconfiglite -y --no-progress

      # Put cl.exe (with INCLUDE/LIB) on PATH so meson compiles vendored
      # dav1d with MSVC instead of the MinGW gcc on PATH - MinGW objects
      # cannot be linked by the Rust MSVC toolchain (___chkstk_ms etc.).
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # macOS runner images ship a homebrew dav1d; if pkg-config finds it, it
      # gets linked dynamically and the released binary would fail on machines
      # without it.  Hide the system .pc files so dav1d-sys falls back to its
      # vendored build (static, pinned to dav1d 1.5.0) instead.
      - name: Force vendored static dav1d (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/empty-pc"
          echo "PKG_CONFIG_LIBDIR=$RUNNER_TEMP/empty-pc" >> "$GITHUB_ENV"

      # Release binaries are built without the optional libvips accelerated
      # loader (feature "vips") so they have no runtime dependency on
      # libvips/glib.  Build from source with --features vips to enable it.
      # pwsh (not bash!) on Windows: a Git Bash shell prepends /usr/bin to
      # PATH, where coreutils 'link' shadows MSVC's link.exe, which rustc
      # picks up once INCLUDE/LIB are set by msvc-dev-cmd.  Note: shell:
      # supports no dynamic contexts here, hence two static steps.
      - name: Build binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: auto
        run: cargo build --release --target ${{ matrix.target }} --no-default-features

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: auto
          CC: cl
        run: cargo build --release --target ${{ matrix.target }} --no-default-features

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/egiv-${{ matrix.target }}.tar.gz" egiv

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/egiv.exe -DestinationPath egiv-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: egiv-${{ matrix.target }}
          path: egiv-*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [version-check, build]
    if: ${{ needs.version-check.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          name: egiv v${{ needs.version-check.outputs.version }}
          files: dist/*
          generate_release_notes: true
