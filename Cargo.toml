[package]
name = "egiv"
version = "0.4.4.1"
edition = "2021"
description = "Combined image viewer (nsxiv-like) and image selector (dmenu-like), written in Rust with egui/eframe"

[lib]
name = "egiv_lib"
path = "src/lib.rs"

[[bin]]
name = "egiv"
path = "src/main.rs"

[features]
default = ["vips"]
# Optional libvips accelerated loader.  The pure-Rust `image` fallback covers
# everything libvips does; vips only speeds up large-image decoding and adds
# a runtime dependency on libvips/glib (and needs the dev packages to build).
vips = ["dep:libvips"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.31"
image = { version = "0.25", features = ["gif", "png", "jpeg", "webp", "bmp", "ico", "tga", "tiff", "pnm", "avif-native", "qoi"] }
walkdir = "2"
sha1 = "0.10"
libvips = { version = "2.3", optional = true }
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
# X11 window-type hints (floating/dialog windows); unix-only because
# x11-dl uses dlopen(3), which libc on Windows does not provide.
x11-dl = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
